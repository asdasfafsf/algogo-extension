<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>알고고 제출</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <form id="submit-form" style="width: 300px; padding: 20px; font-family: 'Arial', sans-serif;">
      <h1 style="color: #4A90E2; margin-bottom: 20px;">알고고 제출</h1>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold;">문제 번호</label>
        <input type="text" id="problem-id" placeholder="1000" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold;">언어</label>
        <select id="language" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
          <option value="Node.js">Node.js</option>
          <option value="Python">Python</option>
          <option value="Java">Java</option>
          <option value="C++">C++</option>
        </select>
      </div>
      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: #333; font-weight: bold;">코드</label>
        <textarea id="code" rows="10" placeholder="코드를 입력하세요..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; resize: vertical;"></textarea>
      </div>
      <div id="status" style="margin-bottom: 15px; padding: 10px; border-radius: 4px; display: none;"></div>
      <button type="submit" id="submit-button" style="width: 100%; background-color: #4A90E2; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        제출하기
      </button>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
